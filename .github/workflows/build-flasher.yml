name: Build desktop flashers 1.7.0

env:
  FIRMWARE_VERSION: "1.16.4"
  FLASHER_VERSION: "1.7.0"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach packages to (blank builds artifacts only)"
        required: false
        type: string
  release:
    types: [published]
  push:
    paths:
      - "flasher/**"
      - "scripts/build-gui-*"
      - "scripts/package_flasher.py"
      - "release/*.bin"
      - "release/manifest.json"
      - "VERSION"
      - ".github/workflows/build-flasher.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: MarauderEternalFlasher
          - os: windows-latest
            platform: windows
            executable: MarauderEternalFlasher.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flasher/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r flasher/requirements-build.txt
      - name: Test
        shell: bash
        run: |
          test "$(head -n 1 VERSION)" = "Marauder Eternal ${FIRMWARE_VERSION}"
          python -m unittest discover -v
          python scripts/package_release.py --verify
          bash scripts/test-native.sh
      - name: Build
        run: >-
          pyinstaller --clean --noconfirm
          --distpath dist/${{ matrix.platform }}
          --workpath .build/pyinstaller-${{ matrix.platform }}
          flasher/MarauderEternalFlasher.spec
      - name: Bundled self-test
        shell: bash
        run: ./dist/${{ matrix.platform }}/${{ matrix.executable }} --self-test
      - name: Create update package and checksums
        shell: bash
        run: python scripts/package_flasher.py dist/${{ matrix.platform }}/${{ matrix.executable }} --platform ${{ matrix.platform }}-x86_64
      - name: Preserve device OTA compatibility for desktop-only releases
        if: matrix.platform == 'linux' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          has_manifest="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name == "manifest.json")] | length')"
          if [[ "$has_manifest" == "0" ]]; then
            app_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[] | select(.name | endswith(".app.bin"))] | length')"
            if [[ "$app_count" != "0" ]]; then
              echo "::error::Release contains a firmware application without its manifest; attach the matching manifest before publishing desktop updates."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release/manifest.json \
              release/"Marauder_Eternal_${FIRMWARE_VERSION}_MiniV3_ESP32-C5"*.bin \
              release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          fi
      - name: Attach native update assets to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PACKAGE_PLATFORM: ${{ matrix.platform }}-x86_64
        run: |
          extension=""
          if [[ "$PACKAGE_PLATFORM" == windows-* ]]; then extension=".exe"; fi
          gh release upload "$RELEASE_TAG" \
            "dist/${{ matrix.platform }}/MarauderEternalFlasher-${FLASHER_VERSION}-${PACKAGE_PLATFORM}${extension}" \
            "dist/${{ matrix.platform }}/flasher-${PACKAGE_PLATFORM}.json" \
            "dist/${{ matrix.platform }}/flasher-${PACKAGE_PLATFORM}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: MarauderEternalFlasher-${{ env.FLASHER_VERSION }}-${{ matrix.platform }}
          path: |
            dist/${{ matrix.platform }}/${{ matrix.executable }}
            dist/${{ matrix.platform }}/SHA256SUMS
            dist/${{ matrix.platform }}/MarauderEternalFlasher-*-${{ matrix.platform }}-x86_64*
            dist/${{ matrix.platform }}/flasher-${{ matrix.platform }}-x86_64.*
          if-no-files-found: error
